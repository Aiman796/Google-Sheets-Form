<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="form-box">

            <h1>Contact Form</h1>
            <p class="subtitle">Please fill in the information below.</p>

            <form id="contactForm">

                <!-- Full Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                        minlength="3"
                    >
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="03XX-XXXXXXX"
                        pattern="[0-9+\-\s]{10,15}"
                        required
                    >
                </div>

                <!-- Gender -->
                <div class="form-group">
                    <label>Gender</label>

                    <div class="gender-options">

                        <label class="radio-label">
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                                required
                            >
                            Male
                        </label>

                        <label class="radio-label">
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >
                            Female
                        </label>

                    </div>
                </div>

                <!-- Date of Birth -->
                <div class="form-group">
                    <label for="dob">Date of Birth</label>

                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        required
                    >
                </div>

                <!-- City -->
                <div class="form-group">
                    <label for="city">City</label>

                    <select id="city" name="city" required>

                        <option value="">Select your city</option>

                        <option value="Faisalabad">Faisalabad</option>
                        <option value="Lahore">Lahore</option>
                        <option value="Islamabad">Islamabad</option>
                        <option value="Rawalpindi">Rawalpindi</option>
                        <option value="Karachi">Karachi</option>
                        <option value="Multan">Multan</option>
                        <option value="Peshawar">Peshawar</option>
                        <option value="Other">Other</option>

                    </select>
                </div>

                <!-- Message -->
                <div class="form-group">
                    <label for="message">Message / Comments</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message..."
                        required
                        minlength="5"
                    ></textarea>
                </div>

                <!-- Submit -->
                <button type="submit" id="submitBtn">
                    Submit
                </button>

                <!-- Message -->
                <div id="statusMessage"></div>

            </form>

        </div>

    </div>

    <script>

        const scriptURL = "https://script.google.com/macros/s/AKfycbxa6sFC7W6bKvWgtMxalA1uZV0sy32e_gKozqOxZxqQrUO-oEr3LXEwfhmvB60X_4KV/exec";

        const form = document.getElementById("contactForm");
        const submitBtn = document.getElementById("submitBtn");
        const statusMessage = document.getElementById("statusMessage");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";

            statusMessage.textContent = "";
            statusMessage.className = "";

            const formData = new FormData(form);

            fetch(scriptURL, {
                method: "POST",
                mode: "no-cors",
                body: formData
            })
            .then(function() {

                statusMessage.textContent =
                    "Your information has been submitted successfully.";

                statusMessage.className = "success";

                form.reset();

                submitBtn.disabled = false;
                submitBtn.textContent = "Submit";

            })
            .catch(function(error) {

                console.log(error);

                statusMessage.textContent =
                    "Submission failed. Please try again.";

                statusMessage.className = "error";

                submitBtn.disabled = false;
                submitBtn.textContent = "Submit";

            });

        });

    </script>

</body>
</html>
